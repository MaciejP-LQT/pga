<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070a26">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Trwa przerwa techniczna w Visa Games. Zajrzyj ponownie za jakiś czas.">
    <title>Przerwa techniczna — Visa Games</title>
    <link rel="preload" href="fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Inter_24pt-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Inter_24pt-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>
    <div class="maintenance">
        <header class="brand">
            <p class="brand-partners">VISA <span>×</span> KFC <span>×</span> MSI <span>×</span> Intel</p>
            <p class="brand-caption">GAME HUB</p>
        </header>

        <main class="panel" aria-labelledby="maintenance-title">
            <div class="pause-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="currentColor" focusable="false">
                    <path d="M18 14h10v36H18zM36 14h10v36H36z"/>
                </svg>
            </div>
            <p class="status"><span class="status-dot" aria-hidden="true"></span>Przerwa techniczna</p>
            <h1 id="maintenance-title">Chwila przerwy <span>i wracamy do gry!</span></h1>
            <p class="description">Nasze gry są teraz chwilowo niedostępne.</p>
            <div class="pixel-divider" aria-hidden="true"><span></span><span></span><span></span></div>
            <p class="return-message">Zajrzyj ponownie za jakiś czas.<br>Dzięki za cierpliwość!</p>
            <a class="refresh-link" href="">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M20 7v5h-5M4 17v-5h5"/>
                    <path d="M6.1 7a7 7 0 0 1 11.5-.6L20 9M4 15l2.4 2.6A7 7 0 0 0 17.9 17"/>
                </svg>
                Odśwież stronę
            </a>
        </main>

        <footer class="footer">Jeszcze chwila i kolejna runda przed Tobą.</footer>
    </div>
</body>
</html>
