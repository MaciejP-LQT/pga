<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Gaming Challange</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;              /* brak przewijania/zoomu przy przesuwaniu palcem */
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #unity-canvas {
        position: fixed; left: 0; top: 0;
        width: 100%; height: 100%;
        display: block;
        background: #000;
        outline: none;
        touch-action: none;
      }
      #loading {
        position: fixed; left: 50%; top: 50%;
        width: 60%; max-width: 320px; height: 8px;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.15);
        border-radius: 4px; overflow: hidden;
      }
      #loading-fill { width: 0%; height: 100%; background: #fff; }
      #error {
        display: none;
        position: fixed; left: 0; right: 0; top: 0;
        padding: 10px; color: #fff; background: #b00020;
        font: 14px sans-serif; text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-fill"></div></div>
    <div id="error"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var errorBox = document.querySelector("#error");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
      }

      // Rozdzielczość canvasa = rozmiar okna (iframe) x gęstość pikseli
      function resize() {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/a7cc2ce67bec13d4521fc8adc1c2748c.data.unityweb",
        frameworkUrl: buildUrl + "/ca18687d775f0bea97e13f8e602663b4.framework.js.unityweb",
        codeUrl: buildUrl + "/52e5043d8e361e19aa2c31417bbd247b.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LiquidThread",
        productName: "Gaming Challange",
        productVersion: "1.0",
        matchWebGLToCanvasSize: false,      // rozmiar ustawiamy sami w resize()
        showBanner: function (msg, type) {
          if (type === "error") showError(msg);
          else console.warn(msg);
        }
      };

      resize();
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

      var script = document.createElement("script");
      script.src = buildUrl + "/5e80df0be21cf4119af132c0b7238a20.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          canvas.focus();   // klawiatura/pad działają bez klikania w grę
        }).catch(function (message) {
          showError(message);
        });
      };
      script.onerror = function () {
        showError("Nie udało się wczytać " + script.src + " - sprawdź ścieżkę (iframe src musi kończyć się na / albo index.html).");
      };
      document.body.appendChild(script);

      // kliknięcie/dotyk w grę oddaje jej fokus (ważne w iframe dla klawiatury)
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
